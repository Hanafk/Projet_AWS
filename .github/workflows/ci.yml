name: CI # ⚠ ce nom sera réutilisé par aws.yml
on: # QUAND lancer le workflow
push:
branches: [ main ]
pull_request:
branches: [ main ]
jobs:
test:
runs-on: ubuntu-latest # OÙ : une machine Ubuntu prêtée par GitHub
steps: # QUOI : les étapes, dans l'ordre
- name: Checkout
uses: actions/checkout@v4
- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.12'
- name: Set up uv
uses: astral-sh/setup-uv@v4
- name: Sync dependencies with uv (locked)
run: |
uv sync --frozen
uv pip install pytest
- name: Run tests
env:
PYTHONPATH: ${{ github.workspace }}/multi_doc_chat
GROQ_API_KEY: dummy # fausses clés : les tests n'appellent aucun vrai LLM
GOOGLE_API_KEY: dummy
LLM_PROVIDER: google
run: |
uv run pytest -q
